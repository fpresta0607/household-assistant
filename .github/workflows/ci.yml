name: ci

on:
  # A draft is skipped below, so the run that matters is the one when it is
  # marked ready, which the default types do not include.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A draft's run and a ready run sit in separate groups: a pull request opened
# as a draft and marked ready in the same second otherwise had its ready run
# cancelled by the draft's, which skips, and ran no checks at all.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test --experimental-test-coverage tests/pocket-piggies/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
